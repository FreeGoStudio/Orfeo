name: Stats

# Once a day: record release downloads and repository traffic on the `stats`
# branch and rebuild stats/traffic.md. Nothing to click; "Run workflow" on the
# Actions tab runs it on demand. Does not touch main, dev or releases.

on:
  schedule:
    - cron: '17 5 * * *'   # 05:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Open the stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch --depth=1 origin stats
            git worktree add -B stats stats-data origin/stats
          else
            git worktree add --orphan -b stats stats-data
          fi

      - name: Collect
        env:
          GH_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
          OWN_DOWNLOADS: '4'
        run: python3 tools/stats/collect.py --out stats-data

      - name: Save
        if: always()
        working-directory: stats-data
        run: |
          [ -f traffic.md ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m "stats: $(date -u +%F)"
          git push origin stats
