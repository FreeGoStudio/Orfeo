# Uploads a release's Microsoft Store package to Partner Center.
#
# Runs as step 4 of release.yml. Can also be started by hand to retry a Store
# upload without rebuilding or republishing anything: GitHub → Actions →
# Microsoft Store → Run workflow, with the number of the Release run whose
# package to send (the number at the end of that run's address,
# …/actions/runs/NUMBER). Needs the one-time setup in docs/CONTRIBUTING.md →
# "Microsoft Store"; until then it just says so and skips.
name: Microsoft Store

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      mode:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      run_id:
        description: "Number of the Release run whose Store package to upload (…/actions/runs/NUMBER)"
        required: true
      mode:
        description: "draft: stage it in Partner Center for you to submit · submit: send it for certification"
        type: choice
        options: [draft, submit]
        default: draft

permissions:
  actions: read
  contents: read

jobs:
  store:
    name: Upload to the Microsoft Store
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check the Store setup
        id: setup
        shell: bash
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER: ${{ secrets.SELLER_ID }}
          PRODUCT: ${{ vars.MS_STORE_PRODUCT_ID }}
        run: |
          if [ -z "$TENANT" ] || [ -z "$CLIENT" ] || [ -z "$SECRET" ] || [ -z "$SELLER" ] || [ -z "$PRODUCT" ]; then
            echo "### Microsoft Store skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The Store secrets or the MS_STORE_PRODUCT_ID variable aren't set up yet — see docs/CONTRIBUTING.md → Microsoft Store. Upload Orfeo-*.appx from the release run's store-package artifact in Partner Center by hand this time." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.setup.outputs.ready == 'true'
        with:
          name: store-package
          path: store
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Set up the Microsoft Store Developer CLI
        if: steps.setup.outputs.ready == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Sign in to Partner Center
        if: steps.setup.outputs.ready == 'true'
        run: >
          msstore reconfigure
          --tenantId "${{ secrets.AZURE_AD_TENANT_ID }}"
          --sellerId "${{ secrets.SELLER_ID }}"
          --clientId "${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}"
          --clientSecret "${{ secrets.AZURE_AD_APPLICATION_SECRET }}"

      # 'publish' starts a new submission from the last published one (same
      # listing, screenshots, price), swaps in the new package, and commits it
      # for certification; 'draft' only uploads and leaves the submission for
      # you in Partner Center (--noCommit). The CLI takes only .msix files: an
      # .appx (what electron-builder makes) is the same package format, so it
      # is handed over under that name. The Store accepts an .msix only if it
      # targets Windows 10 1809 or newer: appx.minVersion in package.json.
      - name: Upload to the Store
        if: steps.setup.outputs.ready == 'true'
        shell: pwsh
        env:
          PRODUCT: ${{ vars.MS_STORE_PRODUCT_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          $appx = Get-ChildItem store -Filter *.appx | Select-Object -First 1
          if (-not $appx) { throw "No .appx in the store-package artifact." }
          $pkg = Join-Path $appx.DirectoryName ($appx.BaseName + '.msix')
          Copy-Item $appx.FullName $pkg
          $name = Split-Path $pkg -Leaf
          if ($env:MODE -eq 'draft') {
            msstore publish $pkg -id $env:PRODUCT --noCommit
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "### Microsoft Store: draft staged" >> $env:GITHUB_STEP_SUMMARY
            "$name is uploaded to a draft submission. Review and submit it in Partner Center." >> $env:GITHUB_STEP_SUMMARY
          } else {
            msstore publish $pkg -id $env:PRODUCT
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "### Microsoft Store: submitted" >> $env:GITHUB_STEP_SUMMARY
            "$name is submitted for certification (usually hours, up to 3 business days). Store users get the update automatically once it passes." >> $env:GITHUB_STEP_SUMMARY
          }
