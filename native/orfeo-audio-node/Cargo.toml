[package]
name = "orfeo-audio-node"
version = "0.1.0"
edition = "2021"
description = "Node add-on wrapping Orfeo's native audio engine (loaded by electron/audioHost.ts)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
orfeo-audio = { path = "../orfeo-audio" }
napi = "3"
napi-derive = "3"

[build-dependencies]
napi-build = "2"
